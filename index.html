<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Smart Wardrobe 智慧穿搭衣櫃</title><link rel="manifest" href="manifest.webmanifest?v=2"><link rel="apple-touch-icon" href="icons/icon-192.png?v=2"><link rel="stylesheet" href="style.css?v=024"></head><body><header class="top"><div><small>MY DAILY STYLE</small><h1>Smart Wardrobe</h1></div><span class="logo">✿</span></header><main id="app"></main><nav class="bottom" aria-label="主要導覽"><button data-page="home">⌂<span>首頁</span></button><button data-page="closet">▦<span>衣櫃</span></button><button data-page="outfits">✧<span>推薦</span></button><button data-page="history">▤<span>紀錄</span></button><button data-page="settings">⚙<span>設定</span></button></nav><dialog id="editor"><form id="itemForm"><h2 id="editorTitle">新增單品</h2><input type="hidden" name="id"><label>名稱<input name="name" required maxlength="80"></label><label>分類<select name="category"><option>上衣</option><option>褲裝</option><option>裙裝</option><option>洋裝</option><option>外套</option><option>鞋子</option><option>帽子</option><option>襪子／褲襪</option><option>飾品</option><option>其他配件</option></select></label><label>顏色<input name="color" placeholder="例如：奶白"></label><label>風格<input name="style" placeholder="例如：日系休閒"></label><label>季節<select name="season"><option value="all">四季</option><option value="warm">溫暖季節</option><option value="cool">涼爽季節</option></select></label><label>狀態<select name="status"><option value="owned">已擁有</option><option value="wishlist">考慮購買</option></select></label><label>照片<input id="photoInput" type="file" accept="image/*"></label><img id="photoPreview" alt="照片預覽" hidden><label>備註<textarea name="notes" rows="2" placeholder="版型、尺寸、穿著限制"></textarea></label><div class="actions"><button type="button" class="secondary" id="cancelEditor">取消</button><button type="submit">儲存</button></div></form></dialog><input id="importFile" type="file" accept="application/json" hidden><script src="app.js?v=024" defer></script></body></html>
